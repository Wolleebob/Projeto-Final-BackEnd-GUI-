<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelato & Cia · Nossos Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(145deg, #fde9e0 0%, #fff3e8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---- CABEÇALHO ---- */
    .header-full {
      width: 100%;
      background: rgba(255, 245, 235, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(214, 122, 90, 0.15);
      padding: 0.8rem 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-sorveteria { display: flex; align-items: center; gap: 0.6rem; }
    .logo-sorveteria i { font-size: 2.4rem; color: #d67a5a; filter: drop-shadow(0 4px 10px rgba(214, 122, 90, 0.2)); }
    .logo-sorveteria h2 {
      font-weight: 700; font-size: 1.8rem; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #b8653a, #e09b7a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo-sorveteria span { font-size: 1.4rem; color: #f3c7a2; }

    .nav-links { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .nav-links a {
      text-decoration: none; font-weight: 600; font-size: 1.05rem; color: #4a2c1b;
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.2rem; border-radius: 60px; transition: 0.2s;
      cursor: pointer;
    }
    .nav-links a i { font-size: 1.2rem; color: #b8653a; transition: 0.2s; }
    .nav-links a:hover { background: #ffded0; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(214, 122, 90, 0.12); }
    .nav-links a:hover i { color: #9f4e2c; }
    .nav-links a.active { background: #d67a5a; color: #fff6ed; box-shadow: 0 6px 14px rgba(214, 122, 90, 0.25); }
    .nav-links a.active i { color: #fff6ed; }

    /* ---- BOTÃO DO CARRINHO NO HEADER ---- */
    .btn-carrinho-top {
      position: relative; background: #d67a5a; color: white;
      padding: 0.6rem 1.2rem; border-radius: 60px; border: none;
      font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
      transition: 0.25s; box-shadow: 0 4px 12px rgba(214, 122, 90, 0.3);
    }
    .btn-carrinho-top:hover { transform: scale(1.05); background: #c06542; }
    .badge-carrinho {
      background: #fff; color: #d67a5a; font-size: 0.8rem; font-weight: 700;
      width: 22px; height: 22px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; position: absolute;
      top: -5px; right: -5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ---- CONTEÚDO ---- */
    .main-content {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      width: 100%; padding: 2rem 1rem;
    }

    .form-title {
      text-align: center; font-weight: 700; font-size: 2.2rem; color: #3f2a1b;
      margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 0.8rem;
    }
    .form-title i { color: #d67a5a; font-size: 2.2rem; }

    /* ---- FILTROS ---- */
    .filtros {
      display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center;
      margin-bottom: 2rem; width: 100%; max-width: 1200px;
    }
    .filtros input, .filtros select {
      font-family: 'Quicksand', sans-serif;
      padding: 0.7rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(214, 122, 90, 0.3);
      background: rgba(255, 250, 245, 0.9);
      font-size: 1rem; color: #3f2a1b; outline: none;
      transition: 0.2s; font-weight: 500;
    }
    .filtros input:focus, .filtros select:focus {
      border-color: #d67a5a; box-shadow: 0 0 0 4px rgba(214, 122, 90, 0.15);
    }
    .filtros button {
      font-family: 'Quicksand', sans-serif; font-weight: 700; cursor: pointer;
      padding: 0.7rem 1.4rem; border-radius: 60px; border: none;
      background: linear-gradient(135deg, #d67a5a, #c06542); color: #fff;
      box-shadow: 0 8px 18px rgba(214, 122, 90, 0.25); transition: 0.25s;
    }
    .filtros button:hover { transform: scale(1.03); }

    /* ---- GRID ---- */
    .produtos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.8rem; max-width: 1200px; width: 100%; margin: 0 auto;
    }

    .produto-card {
      background: rgba(255, 250, 245, 0.7);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 48px 48px 40px 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0, 0, 0, 0.04);
      padding: 2rem 1.5rem 2rem;
      border: 1px solid rgba(255, 240, 230, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .produto-card:hover { transform: scale(1.02); box-shadow: 0 28px 48px rgba(214, 122, 90, 0.18); }

    /* AQUI ESTÁ A MUDANÇA PARA AS IMAGENS REAIS */
    .produto-icone {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: drop-shadow(0 8px 12px rgba(214, 122, 90, 0.25));
      border-radius: 20px;
      background: #fff;
    }

    .produto-categoria {
      display: inline-block;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; color: #b8653a;
      background: #ffe6d8; padding: 0.25rem 0.8rem;
      border-radius: 60px; margin-bottom: 0.6rem;
    }

    .produto-nome {
      font-weight: 700; font-size: 1.4rem; color: #3f2a1b;
      margin-bottom: 0.6rem;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .produto-nome i { color: #d67a5a; font-size: 1.1rem; }

    .produto-preco {
      font-weight: 700; font-size: 1.9rem; color: #b8653a;
      margin: 0.4rem 0 0.8rem;
      display: flex; align-items: center; justify-content: center; gap: 0.3rem;
    }
    .produto-preco span { font-size: 1rem; color: #b28a78; font-weight: 600; }

    .btn_enviar {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #d67a5a, #c06542);
      border: none; padding: 0.9rem 1.4rem; border-radius: 60px;
      font-weight: 700; font-size: 1.1rem; color: white; cursor: pointer;
      transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      box-shadow: 0 8px 18px rgba(214, 122, 90, 0.25);
      width: 100%; margin-top: 0.6rem;
    }
    .btn_enviar i { font-size: 1.2rem; color: #ffeee5; }
    .btn_enviar:hover { transform: scale(1.02); background: linear-gradient(135deg, #c06542, #a85230); }
    .btn_enviar:active { transform: scale(0.97); }

    /* ---- PAGINAÇÃO ---- */
    .paginacao {
      display: flex; gap: 0.5rem; justify-content: center; align-items: center;
      margin: 2rem 0 1rem; flex-wrap: wrap;
    }
    .paginacao button {
      font-family: 'Quicksand', sans-serif; font-weight: 700;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(214, 122, 90, 0.3);
      background: rgba(255, 250, 245, 0.9);
      color: #4a2c1b; cursor: pointer; transition: 0.2s;
    }
    .paginacao button:hover:not(:disabled) { background: #ffe6d8; }
    .paginacao button.ativo {
      background: #d67a5a; color: #fff; border-color: #d67a5a;
      box-shadow: 0 6px 14px rgba(214, 122, 90, 0.25);
    }
    .paginacao button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---- FOOTER ---- */
    .footer-sorvete {
      margin-top: 2rem; font-size: 0.9rem; color: #b28a78;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      font-weight: 500; width: 100%; padding-bottom: 0.5rem;
    }
    .footer-sorvete i { color: #d67a5a; font-size: 1rem; }
    .footer-sorvete span { color: #b8653a; font-weight: 700; }

    /* ==========================================
       NOVO: ESTILOS DO CARRINHO LATERAL (SIDEBAR)
       ========================================== */
    .carrinho-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
      z-index: 998; opacity: 0; visibility: hidden; transition: 0.3s;
    }
    .carrinho-overlay.aberto { opacity: 1; visibility: visible; }

    .carrinho-sidebar {
      position: fixed; top: 0; right: -400px; width: 100%; max-width: 380px; height: 100%;
      background: #fffaf5; z-index: 999; box-shadow: -5px 0 30px rgba(0,0,0,0.1);
      transition: 0.3s ease-in-out; display: flex; flex-direction: column;
    }
    .carrinho-sidebar.aberto { right: 0; }

    .carrinho-header {
      padding: 1.5rem; border-bottom: 1px solid #eee; display: flex;
      justify-content: space-between; align-items: center;
    }
    .carrinho-header h3 { color: #3f2a1b; font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; }
    .btn-fechar { background: none; border: none; font-size: 1.5rem; color: #b28a78; cursor: pointer; }
    .btn-fechar:hover { color: #d67a5a; }

    .carrinho-itens { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    
    .item-carrinho {
      display: flex; gap: 1rem; background: white; padding: 1rem;
      border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      align-items: center;
    }
    .item-carrinho img { width: 60px; height: 60px; object-fit: contain; border-radius: 8px; }
    .item-info { flex: 1; }
    .item-info h4 { font-size: 1rem; color: #3f2a1b; }
    .item-info p { font-size: 0.85rem; color: #b28a78; }
    .item-acoes { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; }
    .item-acoes button { 
      width: 24px; height: 24px; border-radius: 50%; border: 1px solid #ddd; 
      background: white; cursor: pointer; color: #4a2c1b; font-weight: bold;
    }
    .item-acoes span { font-weight: 700; font-size: 0.95rem; color: #3f2a1b; }
    .item-preco { font-weight: 700; color: #d67a5a; }

    .carrinho-footer { padding: 1.5rem; border-top: 1px solid #eee; background: #fffaf5; }
    .total-linha { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; color: #3f2a1b; margin-bottom: 1rem; }
    .total-linha span { color: #d67a5a; }

    .form-pagamento { margin-bottom: 1rem; }
    .form-pagamento select {
      width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid #ddd;
      font-family: 'Quicksand', sans-serif; font-weight: 600; color: #3f2a1b;
      outline: none; background: white;
    }

    .btn-finalizar {
      width: 100%; padding: 1rem; border-radius: 60px; border: none;
      background: linear-gradient(135deg, #d67a5a, #c06542); color: white;
      font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.1rem;
      cursor: pointer; transition: 0.2s; box-shadow: 0 8px 18px rgba(214, 122, 90, 0.25);
      display: flex; justify-content: center; align-items: center; gap: 0.5rem;
    }
    .btn-finalizar:hover { transform: scale(1.02); }
    .btn-finalizar:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

    .carrinho-vazio { text-align: center; color: #b28a78; margin-top: 3rem; }
    .carrinho-vazio i { font-size: 3rem; margin-bottom: 1rem; color: #f3c7a2; }

    /* ---- RESPONSIVO ---- */
    @media (max-width: 700px) {
      .header-full { flex-direction: column; gap: 0.5rem; padding: 0.8rem 1rem; }
      .logo-sorveteria h2 { font-size: 1.5rem; }
      .nav-links { justify-content: center; width: 100%; }
      .nav-links a { font-size: 0.9rem; padding: 0.3rem 0.9rem; }
      .form-title { font-size: 1.8rem; }
      .produtos-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
      .produto-card { padding: 1.5rem 1.2rem; }
      .produto-icone { width: 120px; height: 120px; }
      .produto-nome { font-size: 1.2rem; }
      .produto-preco { font-size: 1.6rem; }
    }
    @media (max-width: 480px) {
      .nav-links a { font-size: 0.8rem; padding: 0.2rem 0.7rem; gap: 0.2rem; }
      .nav-links a i { font-size: 1rem; }
      .logo-sorveteria i { font-size: 2rem; }
      .logo-sorveteria h2 { font-size: 1.3rem; }
      .form-title { font-size: 1.5rem; flex-wrap: wrap; }
      .produtos-grid { grid-template-columns: 1fr; max-width: 320px; }
      .produto-card { border-radius: 36px 36px 32px 32px; }
    }
  </style>
</head>
<body>

  <!-- OVERLAY ESCURO QUANDO O CARRINHO ESTÁ ABERTO -->
  <div class="carrinho-overlay" id="carrinho-overlay"></div>

  <!-- CARRINHO LATERAL -->
  <aside class="carrinho-sidebar" id="carrinho-sidebar">
    <div class="carrinho-header">
      <h3><i class="fas fa-shopping-bag" style="color: #d67a5a;"></i> Seu Carrinho</h3>
      <button class="btn-fechar" id="btn-fechar-carrinho"><i class="fas fa-times"></i></button>
    </div>
    
    <div class="carrinho-itens" id="carrinho-itens">
      <!-- Itens serão inseridos aqui via JS -->
    </div>

    <div class="carrinho-footer">
      <div class="form-pagamento">
        <label for="forma-pagamento" style="font-size: 0.9rem; color: #3f2a1b; font-weight: 600; display: block; margin-bottom: 0.5rem;">Forma de Pagamento:</label>
        <select id="forma-pagamento">
          <option value="pix">PIX</option>
          <option value="cartao_credito">Cartão de Crédito</option>
          <option value="cartao_debito">Cartão de Débito</option>
          <option value="dinheiro">Dinheiro na entrega</option>
        </select>
      </div>
      <div class="total-linha">
        Total: <span id="carrinho-total">R$ 0,00</span>
      </div>
      <button class="btn-finalizar" id="btn-finalizar-compra">
        <i class="fas fa-check-circle"></i> Finalizar Pedido
      </button>
    </div>
  </aside>

  <header class="header-full">
    <div class="logo-sorveteria">
      <i class="fas fa-ice-cream"></i>
      <h2>Gelato <span>&</span> Cia</h2>
    </div>
    <nav class="nav-links">
      <a href="#" class="active"><i class="fas fa-store"></i> Produtos</a>
      <a href="#"><i class="fas fa-truck"></i> Pedidos</a>
      <a href="#"><i class="fas fa-heart"></i> Favoritos</a>
      <a href="#" id="user-info"><i class="fas fa-user"></i> Conta</a>
    </nav>
    <!-- BOTÃO DO CARRINHO NO HEADER -->
    <button class="btn-carrinho-top" id="btn-abrir-carrinho">
      <i class="fas fa-shopping-cart"></i> Carrinho
      <span class="badge-carrinho" id="badge-carrinho">0</span>
    </button>
  </header>

  <main class="main-content">
    <div class="form-title">
      <i class="fas fa-snowflake"></i>
      Nossos Sabores
      <i class="fas fa-snowflake"></i>
    </div>

    <!-- Filtros -->
    <div class="filtros">
      <input type="text" id="busca" placeholder="Buscar por nome..." />
      <select id="categoria">
        <option value="">Todas as categorias</option>
        <option value="Clássico">Clássico</option>
        <option value="Regional">Regional</option>
        <option value="Frutado">Frutado</option>
        <option value="Especial">Especial</option>
      </select>
      <select id="ordenacao">
        <option value="">Sem ordenação</option>
        <option value="menor preco">Menor preço</option>
        <option value="maior preco">Maior preço</option>
      </select>
      <input type="number" id="preco_min" placeholder="Preço mín." step="0.5" min="0" />
      <input type="number" id="preco_max" placeholder="Preço máx." step="0.5" min="0" />
    </div>

    <!-- Grade de produtos (preenchida via JS) -->
    <div class="produtos-grid" id="produtos-grid"></div>

    <!-- Paginação (preenchida via JS) -->
    <div class="paginacao" id="paginacao"></div>

    <div class="footer-sorvete">
      <i class="fas fa-ice-cream"></i>
      <span>Gelato & Cia</span> · feito com carinho
      <i class="fas fa-heart" style="color: #d67a5a;"></i>
    </div>
  </main>

  <!-- Script principal -->
  <script src="./pages.js"></script>

  <!-- SCRIPT DO CARRINHO -->
  <script>
    // ==========================================
    // LÓGICA DO CARRINHO
    // ==========================================
    
    // Recupera o carrinho do localStorage ou inicia vazio
    let carrinho = JSON.parse(localStorage.getItem('carrinhoGelato')) || [];

    const sidebar = document.getElementById('carrinho-sidebar');
    const overlay = document.getElementById('carrinho-overlay');
    const btnAbrir = document.getElementById('btn-abrir-carrinho');
    const btnFechar = document.getElementById('btn-fechar-carrinho');
    const containerItens = document.getElementById('carrinho-itens');
    const elTotal = document.getElementById('carrinho-total');
    const badge = document.getElementById('badge-carrinho');
    const btnFinalizar = document.getElementById('btn-finalizar-compra');

    // Abre e fecha a sidebar
    function toggleCarrinho() {
      sidebar.classList.toggle('aberto');
      overlay.classList.toggle('aberto');
    }
    btnAbrir.addEventListener('click', toggleCarrinho);
    btnFechar.addEventListener('click', toggleCarrinho);
    overlay.addEventListener('click', toggleCarrinho);

    // Função chamada pelo botão "Adicionar" do pages.js
    // Você precisará passar o ID, nome, preço, imagem e sabor_id
    window.adicionarAoCarrinho = function(produto) {
      const itemExistente = carrinho.find(i => i.produto_id === produto.produto_id && i.sabor_id === produto.sabor_id);
      
      if (itemExistente) {
        itemExistente.quantidade += 1;
      } else {
        carrinho.push({ ...produto, quantidade: 1 });
      }
      
      atualizarCarrinho();
      
      // Efeito visual para mostrar que adicionou
      btnAbrir.style.transform = 'scale(1.2)';
      setTimeout(() => btnAbrir.style.transform = 'scale(1)', 200);
    };

    // Altera a quantidade (+/-)
    window.alterarQuantidade = function(index, delta) {
      carrinho[index].quantidade += delta;
      if (carrinho[index].quantidade <= 0) {
        carrinho.splice(index, 1);
      }
      atualizarCarrinho();
    };

    // Atualiza a tela e o localStorage
    function atualizarCarrinho() {
      // Salva no localStorage
      localStorage.setItem('carrinhoGelato', JSON.stringify(carrinho));

      // Atualiza o badge (bolinha com número)
      const totalItens = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
      badge.innerText = totalItens;
      badge.style.display = totalItens > 0 ? 'flex' : 'none';

      // Renderiza os itens
      if (carrinho.length === 0) {
        containerItens.innerHTML = `
          <div class="carrinho-vazio">
            <i class="fas fa-shopping-basket"></i>
            <p>Seu carrinho está vazio.</p>
          </div>
        `;
        elTotal.innerText = 'R$ 0,00';
        btnFinalizar.disabled = true;
      } else {
        containerItens.innerHTML = carrinho.map((item, index) => `
          <div class="item-carrinho">
            <img src="${item.imagem}" alt="${item.nome}">
            <div class="item-info">
              <h4>${item.nome}</h4>
              <p>Sabor: ${item.sabor_nome || 'Padrão'}</p>
              <div class="item-acoes">
                <button onclick="alterarQuantidade(${index}, -1)">-</button>
                <span>${item.quantidade}</span>
                <button onclick="alterarQuantidade(${index}, 1)">+</button>
              </div>
            </div>
            <div class="item-preco">
              R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}
            </div>
          </div>
        `).join('');
        
        const total = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
        elTotal.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        btnFinalizar.disabled = false;
      }
    }

    // ==========================================
    // FINALIZAR COMPRA (ENVIA PARA O BACKEND)
    // ==========================================
    btnFinalizar.addEventListener('click', async () => {
      if (carrinho.length === 0) return;

      const formaPagamento = document.getElementById('forma-pagamento').value;
      
      // Prepara o JSON no formato que o backend espera
      const payload = {
        forma_pagamento: formaPagamento,
        produtos: carrinho.map(item => ({
          produto_id: item.produto_id,
          sabor_id: item.sabor_id,
          quantidade: item.quantidade
        }))
      };

      // Pega o token do usuário (você deve salvar isso no login)
      const token = localStorage.getItem('token'); 

      if (!token) {
        alert('Você precisa estar logado para finalizar a compra!');
        return;
      }

      // Muda o botão para "Processando..."
      const textoOriginal = btnFinalizar.innerHTML;
      btnFinalizar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
      btnFinalizar.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/compra', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          alert(`✅ Pedido #${data.compra_id} realizado com sucesso!\nTotal: R$ ${data.valor_total.toFixed(2).replace('.', ',')}`);
          
          // Limpa o carrinho
          carrinho = [];
          atualizarCarrinho();
          toggleCarrinho();
        } else {
          alert(`❌ Erro: ${data.erro || 'Não foi possível finalizar a compra.'}`);
        }
      } catch (error) {
        console.error('Erro na requisição:', error);
        alert('❌ Erro de conexão com o servidor. Tente novamente.');
      } finally {
        // Restaura o botão
        btnFinalizar.innerHTML = textoOriginal;
        btnFinalizar.disabled = false;
      }
    });

    // Inicializa o carrinho ao carregar a página
    atualizarCarrinho();
  </script>
</body>
</html>
